id = "shaft_coupler"
title = "Rigid shaft coupler"
category = "intermediate"
split = "dev"
prompt = """
Design a rigid shaft coupler connecting a 5 mm shaft to an 8 mm shaft.

- Cylindrical body 25 mm diameter, 40 mm long, axis along Z, bottom face on Z = 0, centred on the Z axis.
- An 8 mm diameter bore from the bottom face, 20 mm deep.
- A 5 mm diameter bore from the top face, 20 mm deep (the two bores meet in the middle).
- Two radial set-screw holes, 2.5 mm diameter, entering from the +X side along the X axis and reaching the bore: one at Z = 10, one at Z = 30.
- A 1 mm x 45 degree chamfer on both outer circular edges.
- Name the part "coupler".
"""

