id = "nema17_mount"
title = "NEMA 17 motor mount plate (held out)"
category = "intermediate"
split = "heldout"
prompt = """
Design a mounting plate for a NEMA 17 stepper motor.

- Plate 60 mm (X) x 60 mm (Y) x 5 mm thick, bottom on Z = 0, centred on the origin.
- Central through hole 22.5 mm diameter for the motor's locating boss.
- Four 3.4 mm through holes for the motor screws on a 31 mm square pattern centred on the origin, counterbored from the bottom face 6.5 mm diameter x 3 mm deep (the motor is screwed in from below).
- Two adjustment slots for mounting the plate: 5.5 mm wide, 14 mm long overall (end to end), running along Y, centred at X = -24 and X = +24, Y = 0, through the plate.
- Name the part "mount".
"""

