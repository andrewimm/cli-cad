id = "hex_standoff"
title = "Hex standoff (held out)"
category = "basic"
split = "heldout"
prompt = """
Design a hexagonal standoff.

- A hexagonal prism, 8 mm across the flats, 20 mm long along Z, bottom face on Z = 0, axis on the Z axis. Orient it so two of the flats are parallel to the XZ plane (i.e. the flats are at Y = +-4).
- A 2.5 mm diameter through hole along the axis.
- A 0.5 mm chamfer on the outer edges of both end faces.
- Name the part "standoff".
"""

