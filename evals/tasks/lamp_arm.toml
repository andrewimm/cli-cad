    T = (E[0] + 100 * math.cos(d), 0.0, E[2] - 100 * math.sin(d))
    c, n = math.cos(math.radians(yaw)), math.sin(math.radians(yaw))
    rz = lambda p: (p[0] * c - p[1] * n, p[0] * n + p[1] * c, p[2])
    E, T = rz(E), rz(T)
    axis = (-n, c, 0.0)
    def off(h, p):
        a, q = h["axis"], h["position"]
        v = [pi - qi for pi, qi in zip(p, q)]
        t = sum(x * y for x, y in zip(v, a))
        return math.sqrt(max(0.0, sum(x * x for x in v) - t * t)), abs(abs(sum(x * y for x, y in zip(a, axis))) - 1)
    msgs = []
    for part, pts in (("upper_arm", {"elbow": E, "lamp head": T}), ("lower_arm", {"elbow": E})):
        holes = [h for h in parts[part].find_holes() if abs(h["diameter"] - 5.2) < 0.1]
        for label, p in pts.items():
            best = min((off(h, p) for h in holes), default=(1e9, 1))
            if best[0] > 0.15 or best[1] > 1e-3:
                msgs.append(f"{part} {label} pivot: nearest 5.2 hole axis is {best[0]:.2f} mm from {tuple(round(x, 2) for x in p)}")
    return not msgs, "; ".join(msgs) or "pivots in place"
'''

[[checks]]
type = "param_sweep"
note = "elbow through its range at shoulder 0: no collisions"
parameter = "elbow"
values = [-60, -30, 0, 30, 60]

  [[checks.checks]]
  type = "clearance"
  min_distance = 0.45

