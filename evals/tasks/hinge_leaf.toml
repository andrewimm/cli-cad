id = "hinge_leaf"
title = "Hinge leaf with countersunk holes (held out)"
category = "intermediate"
split = "heldout"
prompt = """
Design one leaf of a butt hinge.

- Leaf plate: 40 mm (X) x 30 mm (Y) x 2 mm thick, bottom on Z = 0, centred on the origin in X and Y.
- Knuckle: a 6 mm diameter cylinder along the X axis, 40 mm long (same extent in X as the plate), whose axis is at Y = 15, Z = 3, merged with the plate.
- A 2.2 mm pin hole through the full length of the knuckle along its axis.
- Three screw holes through the plate, 3.5 mm diameter, at X = -12, 0, 12 and Y = -3, each countersunk from the top face to 7 mm diameter with a 90 degree included angle.
- Name the part "leaf".
"""

