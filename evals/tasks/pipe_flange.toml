id = "pipe_flange"
title = "Pipe flange (held out)"
category = "intermediate"
split = "heldout"
prompt = """
Design a slip-on pipe flange.

- Flange disc: 100 mm diameter, 12 mm thick, bottom face on Z = 0, axis along Z through the origin.
- Hub: 50 mm diameter, on top of the disc, so the overall height is 30 mm.
- Through bore: 30 mm diameter along the axis.
- Six 11 mm bolt holes through the disc on a 75 mm diameter bolt circle, the first one on the +X axis.
- Name the part "flange".
"""

