id = "l_bracket_ribs"
title = "L-bracket with reinforcing ribs"
category = "intermediate"
split = "dev"
prompt = """
Design an L-shaped bracket with two reinforcing ribs (gussets).

- Base plate: 50 mm (X) x 40 mm (Y) x 5 mm thick, bottom on Z = 0, centred on the origin in X and Y.
- Vertical wall: 50 mm wide (X), 5 mm thick (Y), standing on the back edge of the base (its back face flush with the base's back face at Y = +20). The overall height of the bracket is 40 mm.
- Two triangular ribs, each 4 mm thick (X), centred at X = -15 and X = +15. Each rib fills the inside corner between the base top face and the wall front face, with legs 25 mm long along the base (in -Y) and 25 mm up the wall (in +Z).
- Two through holes of 5.5 mm diameter in the base at (X, Y) = (-8, -12) and (8, -12).
- The result must be a single solid. Name the part "bracket".
"""

