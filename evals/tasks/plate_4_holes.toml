type = "part_count"
count = 1

[[checks]]
type = "valid"

[[checks]]
type = "bbox"
size = [80, 50, 5]
min = [-40, -25, 0]
tol = 0.05

[[checks]]
type = "holes"
diameter = 4.5
axis = "z"
positions = [[-34, -19], [34, -19], [-34, 19], [34, 19]]
exact_count = true
tol = 0.1

[[checks]]
type = "volume"
expected = 19468.4
rel_tol = 0.01

[[checks]]
type = "points_outside"
points = [[39.5, 24.5, 2.5], [-39.5, -24.5, 2.5]]
note = "corners must be rounded"
