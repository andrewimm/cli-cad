id = "plate_4_holes"
title = "Mounting plate with four holes"
category = "basic"
split = "dev"
prompt = """
Design a rectangular mounting plate.

- Overall size 80 mm (X) x 50 mm (Y) x 5 mm thick (Z). Bottom face on Z = 0, centred on the origin in X and Y.
- Four through holes, 4.5 mm diameter, with centres 6 mm in from each adjacent edge (a 68 x 38 mm rectangle of holes).
- Round all four vertical corner edges with a 5 mm radius.
- Name the part "plate".
"""

