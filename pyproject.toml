[project]
name = "cad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Imm", email = "aimm22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp>=8.0.1.1.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lib3mf>=2.5.0",
    "pytest>=9.2.0",
]

[project.scripts]
cadpy = "cad.cli:console_main"
