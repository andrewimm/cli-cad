[project]
name = "cad"
version = "0.1.0"
description = "Agent-first parametric CAD on Open CASCADE: Python scripts in; exact solids, renders, analysis and STEP/STL/3MF out"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Andrew Imm", email = "aimm22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp>=8.0.1.1.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.urls]
Repository = "https://github.com/andrewimm/clicd"
Issues = "https://github.com/andrewimm/clicd/issues"

[project.optional-dependencies]
# stress analysis (`cad fea`): gmsh meshes (GPL, so optional), scikit-fem + scipy + pyamg solve
fea = [
    "gmsh>=4.13",
    "scikit-fem>=10.0",
    "scipy>=1.11",
    "pyamg>=5.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lib3mf>=2.5.0",
    "pytest>=9.2.0",
    "gmsh>=4.13",
    "scikit-fem>=10.0",
    "scipy>=1.11",
    "pyamg>=5.0",
]

[project.scripts]
cadpy = "cad.cli:console_main"
